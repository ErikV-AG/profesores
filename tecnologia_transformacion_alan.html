<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-ID Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    #did-agent-container { width: 100%; height: 100%; }

    #elevenlabs-container {
      width: 100%; height: 100%; display: none;
      background: #0f1115;
    }

    /* Sin reglas de posición para elevenlabs-convai a propósito.
       El componente se posiciona solo (position: fixed) y administra su
       propio tamaño; forzarle position/ancho/alto desde fuera lo deja en
       una caja de 0x0 y su contenido se dibuja cortado fuera de la
       pantalla. Verificado en vivo: sin CSS propio se renderiza correcto.
       Este contenedor solo aporta el fondo oscuro. */

    #btn-terminar {
      position: fixed;
      top: 10px;
      left: 14px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #btn-terminar:hover { opacity: 1; }

    /* Aviso breve mientras se hace el cambio de agente */
    #aviso-cambio {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9998;
      display: none;
      align-items: center; justify-content: center;
      background: #0f1115;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

  <div id="did-agent-container"></div>
  <div id="elevenlabs-container"></div>

  <div id="aviso-cambio">Cambiando a modo de voz...</div>

  <button id="btn-terminar" title="Terminar conversación">✕ Terminar</button>

  <script
    type="module"
    src="https://agent.d-id.com/v2/index.js"
    data-mode="full"
    data-client-key="ck_au_-fIbjgB1qT6onuuo7Z"
    data-agent-id="v2_agt_x9BvMVtR"
    data-name="did-agent"
    data-monitor="true"
    data-target-id="did-agent-container">
  </script>

  <script>
    /* =================================================================
       ID del agente de ElevenLabs al que se cae cuando D-ID no puede
       operar en video.
    ================================================================== */
    const ELEVENLABS_AGENT_ID = 'agent_0101m243es8nf93rx65gh1h39nv5';

    /* =================================================================
       DETECCIÓN DE FALTA DE CRÉDITOS EN D-ID

       Cuando la cuenta de D-ID se queda sin créditos, el widget NO lanza
       un error HTTP: todas sus peticiones siguen regresando 200 y la
       pantalla se queda colgada en "Loading...". Lo que sí hace es
       degradar el agente internamente de video a solo-texto y anunciarlo
       por su propio emisor de eventos:

           chatMode  ->  { state: "TextOnly" }
           error     ->  { error: { kind: "ChatModeDowngraded" } }

       Verificado en vivo sobre una página con la cuenta agotada: el
       evento llega ~10 s después de iniciar la conexión.

       Se escuchan ambos (cualquiera de los dos dispara el cambio) más un
       respaldo por tiempo, por si en algún escenario ninguno llegara.

       IMPORTANTE: el evento solo llega DESPUÉS de que el usuario da clic
       en "Iniciar conversación" — no al cargar la página. Verificado en vivo:
       llega 10.3 s después del clic. Por eso el respaldo por tiempo NO
       puede arrancar al cargar: la página puede estar legítimamente
       esperando el clic durante minutos. El temporizador arranca solo
       cuando la conexión pasa a "connecting".
    ================================================================== */

    const TIEMPO_LIMITE_MS = 30000; // respaldo, contado desde "connecting"

    /* Respaldo de ARRANQUE. Caso verificado en vivo: cuando la cuenta de
       D-ID está agotada, el widget a veces se queda en "Loading..." para
       siempre y NO emite ningún evento — ni connection, ni chatMode, ni
       error. Cero. En ese escenario el respaldo anterior (que se contaba
       desde "connecting") nunca arrancaba y la página quedaba colgada.

       La distinción que importa: una página que espera el clic del alumno
       es legítima y puede tardar lo que sea; una que sigue con el overlay
       de carga encima no va a levantar. Por eso no basta con buscar el
       botón de inicio: cuando está colgado, el botón EXISTE y mide 190x40,
       solo que tapado por el overlay. Lo que discrimina es el overlay. */
    const ESPERA_CARGA_MS = 35000;
    let listoParaUsuario = false;
    let temporizadorCarga = null;
    let vigilancia = null;
    let yaCambio = false;
    let conectado = false;
    let temporizador = null;

    function cambiarAElevenLabs(motivo) {
      if (yaCambio) return;
      yaCambio = true;
      clearTimeout(temporizador);
      clearTimeout(temporizadorCarga);
      clearInterval(vigilancia);
      console.log('[agente] Cambiando a ElevenLabs. Motivo:', motivo);

      document.getElementById('aviso-cambio').style.display = 'flex';

      // Cerrar la sesión de D-ID para no dejar la conexión abierta.
      try {
        const agente = document.querySelector('did-agent');
        if (agente && agente.disconnect) agente.disconnect();
      } catch (e) { /* sin consecuencia */ }

      document.getElementById('did-agent-container').style.display = 'none';

      const contenedor = document.getElementById('elevenlabs-container');
      const widget = document.createElement('elevenlabs-convai');
      widget.setAttribute('agent-id', ELEVENLABS_AGENT_ID);

      // Chat de texto junto a la voz. Verificado: este atributo agrega el
      // campo de escritura y el botón de enviar. (La documentación afirma
      // que esto solo se puede activar desde el dashboard; es incorrecto
      // para este build del widget.)
      widget.setAttribute('text-input', 'true');

      // Abre el widget a tamaño completo en vez de la píldora de esquina.
      // "variant=expanded" que aparece en la documentación NO tiene efecto
      // en este build; el atributo real es always-expanded.
      widget.setAttribute('always-expanded', 'true');

      widget.setAttribute('language', 'es');

      // Los atributos sueltos start-call-text / end-call-text / etc. de la
      // documentación NO existen en este build: no están entre los
      // observedAttributes del componente. El mecanismo real es un solo
      // atributo con un objeto JSON de llaves en snake_case.
      widget.setAttribute('text-contents', JSON.stringify({
        action_text: '¿Tienes una pregunta?',
        start_call: 'Iniciar conversación',
        end_call: 'Terminar conversación',
        expand: 'Abrir conversación',
        listening_status: 'Escuchando',
        speaking_status: 'Hablando',
        input_placeholder: 'Escribe tu pregunta...',
      }));

      contenedor.appendChild(widget);

      const script = document.createElement('script');
      // Script oficial que entrega el dashboard de ElevenLabs. El build
      // antiguo (elevenlabs.io/convai-widget/index.js) es legado.
      script.src = 'https://unpkg.com/@elevenlabs/convai-widget-embed';
      script.async = true;
      script.type = 'text/javascript';
      document.body.appendChild(script);

      script.addEventListener('load', () => {
        document.getElementById('aviso-cambio').style.display = 'none';
        contenedor.style.display = 'block';
        autoIniciarElevenLabs(widget);
      });
      // Si el script tarda, mostrar de todos modos para no dejar la
      // pantalla en el aviso indefinidamente.
      setTimeout(() => {
        document.getElementById('aviso-cambio').style.display = 'none';
        contenedor.style.display = 'block';
      }, 6000);
    }

    /* -----------------------------------------------------------------
       Autoinicio de la conversación de ElevenLabs.

       La documentación describe un método widget.startConversation().
       Ese método NO existe en este build: el componente solo expone
       connectedCallback / attributeChangedCallback / disconnectedCallback.
       Verificado en vivo sobre el widget real.

       El camino que sí funciona es pulsar el botón de inicio dentro del
       Shadow DOM del widget — la misma técnica que ya se usa arriba para
       el botón "Terminar" de D-ID.

       Como el usuario ya dio un clic (el de iniciar con D-ID), la página
       tiene interacción previa y el navegador permite abrir el micrófono.

       NOTA: si el agente tiene activados los términos y condiciones en su
       configuración de ElevenLabs, al iniciar aparecerá un diálogo de
       consentimiento que el alumno debe aceptar. Ese diálogo NO se pulsa
       automáticamente a propósito: es una aceptación legal y le
       corresponde a la persona darla. Si no lo quieres en el curso,
       desactívalo en el dashboard (Widget → Terms).
    ------------------------------------------------------------------ */
    function autoIniciarElevenLabs(widget) {
      let intentos = 40; // ~10 s
      const t = setInterval(() => {
        const sr = widget.shadowRoot;
        if (sr) {
          const botones = sr.querySelectorAll('button, [role="button"]');
          let inicio = null;
          for (const b of botones) {
            const etiqueta = (b.getAttribute('aria-label') || b.textContent || '').toLowerCase();
            if (etiqueta.includes('iniciar') || etiqueta.includes('start call')) {
              inicio = b;
              break;
            }
          }
          if (inicio) {
            clearInterval(t);
            inicio.click();
            console.log('[agente] conversación de ElevenLabs iniciada automáticamente');
            return;
          }
        }
        if (!--intentos) {
          clearInterval(t);
          console.log('[agente] no se encontró el botón de inicio; queda el inicio manual');
        }
      }, 250);
    }

    function engancharEventosDID(api) {
      api.events.on('error', ({ error }) => {
        const kind = error && error.kind;
        console.log('[agente] error D-ID:', kind);
        if (kind === 'ChatModeDowngraded') {
          cambiarAElevenLabs('ChatModeDowngraded (sin créditos de video)');
        }
      });

      api.events.on('chatMode', ({ state }) => {
        console.log('[agente] chatMode:', state);
        // "Functional" es el modo completo con video. Cualquier otro
        // (TextOnly, Maintenance) significa que el avatar no va a operar.
        if (state && String(state).toLowerCase() !== 'functional') {
          cambiarAElevenLabs('chatMode = ' + state);
        }
      });

      api.events.on('connection', ({ state }) => {
        console.log('[agente] conexión:', state);

        if (state === 'connecting') {
          // Recién aquí tiene sentido contar tiempo: antes de esto la
          // página está esperando que el usuario dé clic en iniciar.
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            if (!conectado) cambiarAElevenLabs('tiempo límite sin conectar');
          }, TIEMPO_LIMITE_MS);
        }

        if (state === 'connected') {
          conectado = true;
          clearTimeout(temporizador);
        }

        if (state === 'fail') {
          cambiarAElevenLabs('connection = fail');
        }
      });
    }

    // El API global solo existe después de que carga el script del embed.
    (function esperarAPI() {
      let intentos = 60; // ~15 s
      const t = setInterval(() => {
        if (window.DID_AGENTS_API && window.DID_AGENTS_API.events) {
          clearInterval(t);
          engancharEventosDID(window.DID_AGENTS_API);
        } else if (!--intentos) {
          clearInterval(t);
          cambiarAElevenLabs('el embed de D-ID nunca inicializó');
        }
      }, 250);
    })();

    /* ---------- Detección del estado real del widget de D-ID ---------- */

    // Recorre también los shadow roots, donde vive la interfaz de D-ID.
    function hayOverlayCargando(root) {
      if (!root || !root.querySelectorAll) return false;
      if (/loading\.\.\.|cargando\.\.\./i.test(root.textContent || '')) return true;
      for (const el of root.querySelectorAll('*')) {
        if (el.shadowRoot && hayOverlayCargando(el.shadowRoot)) return true;
      }
      return false;
    }

    function hayBotonInicioVisible(root) {
      if (!root || !root.querySelectorAll) return false;
      for (const b of root.querySelectorAll('button, [role="button"]')) {
        const etiqueta = (b.getAttribute('aria-label') || b.textContent || '').toLowerCase();
        if (etiqueta.includes('start call') || etiqueta.includes('iniciar')) {
          const r = b.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) return true;
        }
      }
      for (const el of root.querySelectorAll('*')) {
        if (el.shadowRoot && hayBotonInicioVisible(el.shadowRoot)) return true;
      }
      return false;
    }

    // Vigilancia de arranque: si el widget queda listo y esperando al
    // alumno, se cancela el respaldo (puede tardar lo que quiera en dar
    // clic). Si sigue con el overlay de carga al vencer el plazo, se
    // asume que no va a levantar y se cambia a ElevenLabs.
    vigilancia = setInterval(() => {
      if (yaCambio || conectado) { clearInterval(vigilancia); return; }
      if (!hayOverlayCargando(document.body) && hayBotonInicioVisible(document.body)) {
        listoParaUsuario = true;
        clearInterval(vigilancia);
        clearTimeout(temporizadorCarga);
        console.log('[agente] D-ID listo, esperando al usuario');
      }
    }, 1000);

    temporizadorCarga = setTimeout(() => {
      if (!listoParaUsuario && !conectado) {
        cambiarAElevenLabs('D-ID nunca terminó de cargar');
      }
    }, ESPERA_CARGA_MS);

    /* ---------------------------- Botón terminar ---------------------------- */
    document.getElementById('btn-terminar').addEventListener('click', () => {
      // Si ya se cambió a ElevenLabs, recargar es lo más limpio.
      if (yaCambio) { location.reload(); return; }

      function encontrarEnd(root) {
        if (!root) return null;
        if (root.querySelectorAll) {
          const btns = root.querySelectorAll('button, [role="button"]');
          for (const btn of btns) {
            const txt = btn.textContent.trim().toLowerCase();
            if (txt === 'end' || txt === 'terminar' || txt.includes('end conversation')) {
              return btn;
            }
          }
          for (const el of root.querySelectorAll('*')) {
            if (el.shadowRoot) {
              const found = encontrarEnd(el.shadowRoot);
              if (found) return found;
            }
          }
        }
        return null;
      }

      const endBtn = encontrarEnd(document.body);
      if (endBtn) {
        endBtn.click();
      } else {
        const agent = document.querySelector('did-agent');
        if (agent && agent.disconnect) agent.disconnect();
        location.reload();
      }
    });

    /* ==================================================================
       Diccionario completo del embed D-ID v2.
       Las llaves son las cadenas EXACTAS del bundle, en minúsculas.
       El widget solo trae inglés y alemán de fábrica: no existe opción
       de configuración para español, por eso se parchea el DOM.
    ================================================================== */
    const TRADUCCIONES = {

      /* ---------- Arranque / conexión ---------- */
      'start call':                    'Iniciar conversación',
      'starting...':                   'Iniciando...',
      'connecting...':                 'Conectando...',
      'loading...':                    'Cargando...',
      'hang tight':                    'Un momento',
      'reconnect':                     'Reconectar',
      'continue call...':              'Continuar conversación...',
      "let's continue":                'Continuemos',
      'create new call':               'Crear nueva conversación',
      'start a new call':              'Iniciar una nueva conversación',
      'want to continue where we left off?': '¿Quieres continuar donde nos quedamos?',
      'are you still here?':           '¿Sigues ahí?',
      'call ended':                    'Conversación finalizada',
      'understood':                    'Entendido',
      'skip':                          'Omitir',
      'close':                         'Cerrar',

      /* ---------- Controles de la conversación ---------- */
      'end call':                      'Terminar conversación',
      'turn microphone on':            'Encender micrófono',
      'mute microphone':               'Silenciar micrófono',
      'unmute microphone':             'Activar micrófono',
      'turn off speakers':             'Apagar bocinas',
      'turn on captions':              'Activar subtítulos',
      'turn off captions':             'Desactivar subtítulos',
      'expand menu':                   'Abrir menú',
      'collapse menu':                 'Cerrar menú',
      'select audio device':           'Seleccionar dispositivo de audio',
      'microphone':                    'Micrófono',
      'speakers':                      'Bocinas',
      'camera':                        'Cámara',
      'talk to interrupt':             'Habla para interrumpir',

      /* ---------- Chat ---------- */
      'chat':                          'Chat',
      'chat history':                  'Historial de chat',
      'chat messages':                 'Mensajes del chat',
      'open chat':                     'Abrir chat',
      'close chat':                    'Cerrar chat',
      'type your message here...':     'Escribe tu mensaje aquí...',
      'send message':                  'Enviar mensaje',
      'please wait until the response is complete': 'Espera a que termine la respuesta',
      'agent response':                'Respuesta del agente',
      'agent is thinking':             'El agente está pensando',
      'stop viewing':                  'Dejar de ver',
      'open image':                    'Abrir imagen',
      'open video':                    'Abrir video',

      /* ---------- Permisos de micrófono y cámara ---------- */
      "let's get your permission":     'Necesitamos tu permiso',
      'your browser needs permission to use your microphone.':
        'Tu navegador necesita permiso para usar el micrófono.',
      'got a question?':               '¿Tienes una pregunta?',
      'talk to a live interactive agent, just turn on your mic to start the call.':
        'Habla con un agente interactivo en vivo: solo enciende el micrófono para iniciar la conversación.',
      'we are blocked from using your microphone':
        'El acceso a tu micrófono está bloqueado',
      "click the page info icon in your browser's address bar":
        'Haz clic en el ícono de información de la página en la barra de direcciones',
      'turn on microphone access':     'Permitir acceso al micrófono',
      'we are blocked from using your camera':
        'El acceso a tu cámara está bloqueado',
      'turn on camera access':         'Permitir acceso a la cámara',
      'camera will be available after generating your agent':
        'La cámara estará disponible después de generar tu agente',

      /* ---------- Errores y red ---------- */
      'your network quality is low. this may affect your experience.':
        'Tu conexión es lenta. Esto puede afectar tu experiencia.',
      'the agent is temporarily unavailable. please try again later.':
        'El agente no está disponible por el momento. Inténtalo más tarde.',

      /* ---------- Encuesta de fin de conversación ---------- */
      'rate your experience':          'Califica tu experiencia',
      'submit':                        'Enviar',
      'thanks for your feedback!':     '¡Gracias por tus comentarios!',
      "couldn't send your feedback. please try again.":
        'No se pudieron enviar tus comentarios. Inténtalo de nuevo.',

      /* ---------- Etiquetas de accesibilidad ---------- */
      'control header':                'Encabezado de controles',
      'main controls':                 'Controles principales',
      'welcome message':               'Mensaje de bienvenida',
      'connecting overlay':            'Pantalla de conexión',
      'agent idle video':              'Video del agente en espera',
      'agent video stream':            'Video del agente en vivo',

      // Quita esta línea si prefieres conservar el distintivo "AI"
      'ai':                            'IA',
    };

    /* Avisos que traen datos variables (ids de error), por lo que no se
       pueden traducir por coincidencia exacta. Se buscan por fragmento.
       El primero es el que D-ID muestra al quedarse sin créditos de
       video: "Voice and face animations are temporarily unavailable.
       You can still use the chat. (Error id: xxxxxx)" */
    const TRADUCCIONES_PARCIALES = [
      ['voice and face animations are temporarily unavailable',
       'Las animaciones de voz y rostro no están disponibles por el momento. Puedes seguir usando el chat.'],
    ];

    function traducirArbol(root) {
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let nodo;
      while ((nodo = walker.nextNode())) {
        const lower = nodo.textContent.trim().toLowerCase();
        let hecho = false;
        for (const [en, es] of Object.entries(TRADUCCIONES)) {
          if (lower === en) { nodo.textContent = es; hecho = true; break; }
        }
        if (hecho) continue;
        for (const [frag, es] of TRADUCCIONES_PARCIALES) {
          if (lower.includes(frag)) { nodo.textContent = es; break; }
        }
      }
      if (!root.querySelectorAll) return;
      root.querySelectorAll('[placeholder]').forEach(el => {
        const lower = el.placeholder.toLowerCase();
        for (const [en, es] of Object.entries(TRADUCCIONES)) {
          if (lower.includes(en)) { el.placeholder = es; break; }
        }
      });
      root.querySelectorAll('[aria-label]').forEach(el => {
        const lower = el.getAttribute('aria-label').toLowerCase();
        for (const [en, es] of Object.entries(TRADUCCIONES)) {
          if (lower.includes(en)) { el.setAttribute('aria-label', es); break; }
        }
      });
      root.querySelectorAll('*').forEach(el => {
        if (el.shadowRoot) traducirArbol(el.shadowRoot);
      });
    }

    /* El MutationObserver de document.body NO ve los cambios que ocurren
       dentro de los shadow roots, que es justamente donde D-ID redibuja su
       interfaz. Y el barrido original se detenía a los 20 segundos.
       Resultado verificado en vivo: pasado ese punto, cuando el widget
       redibujaba, volvían a aparecer "Start call", "Loading..." y "AI" en
       inglés y ya nada los corregía.

       Por eso el barrido ahora no se detiene. Es un recorrido barato sobre
       una página de un solo componente, y se ejecuta cada 1.5 s. */
    window.addEventListener('load', () => {
      traducirArbol(document.body);
      new MutationObserver(() => traducirArbol(document.body))
        .observe(document.body, { childList: true, subtree: true });
      setInterval(() => traducirArbol(document.body), 1500);
    });

    window.addEventListener('beforeunload', () => {
      const a = document.querySelector('did-agent');
      if (a && a.disconnect) a.disconnect();
    });
  </script>

</body>
</html>
