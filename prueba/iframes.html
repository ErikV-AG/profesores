<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Prueba en iframe de 350 px</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
           background: #e9e9e6; color: #26292c; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 24px 0 6px; }
    p { margin: 0; font-size: 14px; color: #6b6f73; }
    iframe { display: block; background: #fff; }
  </style>
</head>
<body>
<main>
  <h1>Prueba en iframe de 350 px</h1>
  <p>Cada agente está insertado con el mismo iframe que se pega en Rise.</p>
  <h2>Alan Turing · Tecnología y Transformación Digital</h2>
  <iframe src="https://erikv-ag.github.io/profesores/prueba/tecnologia_transformacion_alan.html"
    width="100%" height="350" frameborder="0"
    allow="microphone; camera; autoplay" allowfullscreen></iframe>
  <h2>Alan Turing · Cálculo I</h2>
  <iframe src="https://erikv-ag.github.io/profesores/prueba/calculo_alan.html"
    width="100%" height="350" frameborder="0"
    allow="microphone; camera; autoplay" allowfullscreen></iframe>
  <h2>Marie Curie · Física</h2>
  <iframe src="https://erikv-ag.github.io/profesores/prueba/fisica_curie.html"
    width="100%" height="350" frameborder="0"
    allow="microphone; camera; autoplay" allowfullscreen></iframe>
</main>
</body>
</html>
